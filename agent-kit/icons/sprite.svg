<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!--
  EdgeLit icon sprite: the SOURCE OF TRUTH. Run `npm run build:icons` to regenerate edgelit-icons.js (the injector the pages load).
  Spec: 16px grid, viewBox 0 0 16 16, stroke comes from .me-ico (1.25, square caps, mitre joins), fill none.
        Straight segments only: no circles, no arcs, no curves.
        Exactly ONE lit segment per icon: a path with style="stroke:var(--ico-l,currentColor)". It lights with hover / selected (--ico-l = signal).
        Keep geometry on whole numbers inside a 2px safe margin (2..14).
-->
<defs>
  <!-- navigation -->
  <symbol id="i-overview" viewBox="0 0 16 16"><path d="M9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/><path d="M2 2h5v5H2z" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-beds" viewBox="0 0 16 16"><path d="M2 3h12v10H2zM8 3v10"/><path d="M2 8h12" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-telemetry" viewBox="0 0 16 16"><path d="M2 2v12h12"/><path d="M5 10l3-3 2 2 4-5" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-components" viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 9h5v5H9zM2 9h5v5H2z"/><path d="M9 2h5v5H9z" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-irrigation" viewBox="0 0 16 16"><path d="M12 8v4l-2 2H6l-2-2V8"/><path d="M8 2l4 6M8 2L4 8" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 16 16"><path d="M2 4h2M2 8h2M2 12h2M6 4h8M6 12h8"/><path d="M6 8h8" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-users" viewBox="0 0 16 16"><path d="M2 14v-3h12v3M5 2v5h6V2"/><path d="M5 2h6" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 16 16"><path d="M2 2h12v12H2zM11 6L9 8l2 2"/><path d="M6 2v12" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-settings" viewBox="0 0 16 16"><path d="M2 5h12M2 11h12"/><path d="M5 3v4M11 9v4" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-docs" viewBox="0 0 16 16"><path d="M3 2h7l3 3v9H3z"/><path d="M6 8h4M6 11h4" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-help" viewBox="0 0 16 16"><path d="M2 3h12v8H6l-4 3z"/><path d="M5 6h6" style="stroke:var(--ico-l,currentColor)"/></symbol>

  <!-- actions -->
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10"/><path d="M3 8h10" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-minus" viewBox="0 0 16 16"><path d="M3 8h5"/><path d="M8 8h5" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M3 3l10 10"/><path d="M13 3L3 13" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8l3 3"/><path d="M6 11l7-7" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><path d="M2 2h8v8H2z"/><path d="M10 10l4 4" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-filter" viewBox="0 0 16 16"><path d="M3 3l5 6v5l2-1V9l5-6"/><path d="M2 3h12" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2 4h12M2 12h12"/><path d="M2 8h12" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-more" viewBox="0 0 16 16"><path d="M2 7h2v2H2zM7 7h2v2H7z"/><path d="M12 7h2v2h-2z" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-edit" viewBox="0 0 16 16"><path d="M2 14l1-4 8-8 3 3-8 8z"/><path d="M9 4l3 3" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><path d="M5 5h9v9H5z"/><path d="M2 11V2h9" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M4 4l1 10h6l1-10M6 4V2h4v2"/><path d="M2 4h12" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-save" viewBox="0 0 16 16"><path d="M2 2h10l2 2v10H2zM5 2v4h6V2"/><path d="M5 14v-4h6v4" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M3 8V4h9M13 8v4H4M6 10l-2 2 2 2"/><path d="M10 2l2 2-2 2" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-upload" viewBox="0 0 16 16"><path d="M2 11v3h12v-3"/><path d="M8 11V2M5 5l3-3 3 3" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-download" viewBox="0 0 16 16"><path d="M2 11v3h12v-3"/><path d="M8 2v9M5 8l3 3 3-3" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M7 5H4L2 8l2 3h3M9 5h3l2 3-2 3H9"/><path d="M6 8h4" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M4 2v12l10-6z"/><path d="M4 2l10 6" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5 2v12"/><path d="M11 2v12" style="stroke:var(--ico-l,currentColor)"/></symbol>

  <!-- direction -->
  <symbol id="i-chevron-down" viewBox="0 0 16 16"><path d="M3 6l5 5"/><path d="M8 11l5-5" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-chevron-up" viewBox="0 0 16 16"><path d="M3 10l5-5"/><path d="M8 5l5 5" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 16 16"><path d="M10 3L5 8"/><path d="M5 8l5 5" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 16 16"><path d="M6 3l5 5"/><path d="M11 8l-5 5" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 16 16"><path d="M8 14V3"/><path d="M4 7l4-4 4 4" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 16 16"><path d="M8 2v11"/><path d="M4 9l4 4 4-4" style="stroke:var(--ico-l,currentColor)"/></symbol>

  <!-- status -->
  <symbol id="i-info" viewBox="0 0 16 16"><path d="M2 2h12v12H2zM8 4h.01"/><path d="M8 7v5" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-warning" viewBox="0 0 16 16"><path d="M8 2l7 12H1zM8 12h.01"/><path d="M8 6v4" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-bell" viewBox="0 0 16 16"><path d="M3 12h10l-1-2V6L10 3H6L4 6v4z"/><path d="M7 14h2" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16"><path d="M3 7h10v7H3z"/><path d="M5 7V3h6v4" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1 8l4-4h6l4 4-4 4H5z"/><path d="M7 7h2v2H7z" style="stroke:var(--ico-l,currentColor)"/></symbol>

  <!-- time, weather, garden -->
  <symbol id="i-calendar" viewBox="0 0 16 16"><path d="M2 3h12v11H2zM5 1v3M11 1v3"/><path d="M2 7h12" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><path d="M2 2h12v12H2z"/><path d="M8 4v4l3 2" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16"><path d="M8 5l3 3-3 3-3-3z"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path d="M10 2L5 4 3 8l2 4 5 2"/><path d="M10 14l-3-3-1-3 1-3 3-3" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 16 16"><path d="M3 13V8l5-5h5v5l-5 5z"/><path d="M3 13L10 6" style="stroke:var(--ico-l,currentColor)"/></symbol>
  <symbol id="i-thermometer" viewBox="0 0 16 16"><path d="M6 2h4v8h2v4H4v-4h2z"/><path d="M8 5v6" style="stroke:var(--ico-l,currentColor)"/></symbol>
</defs>
</svg>
